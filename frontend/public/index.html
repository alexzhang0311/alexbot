<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── API Helper ──
const API_BASE = '/api';

async function api(path, opts = {}) {
  const token = localStorage.getItem('token');
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...opts.headers,
    },
  });
  if (res.status === 401) {
    localStorage.removeItem('token');
    throw new Error('SESSION_EXPIRED');
  }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── Login ──
function LoginPage({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [isRegister, setIsRegister] = useState(false);
  const [fullName, setFullName] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    try {
      if (isRegister) {
        await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({ username, password, email: username + '@company.com', full_name: fullName }),
        });
      }
      const data = await api('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      });
      localStorage.setItem('token', data.access_token);
      onLogin(data.access_token);
    } catch (err) {
      setError(err.message || 'Login failed');
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
      <div className="bg-white rounded-2xl shadow-xl p-8 w-96">
        <h1 className="text-2xl font-bold text-center mb-6 text-indigo-600">🐂 AI Web Tool</h1>
        <form onSubmit={handleSubmit} className="space-y-4">
          <input className="w-full px-4 py-2 border rounded-lg" placeholder="用户名" value={username} onChange={e=>setUsername(e.target.value)} />
          {isRegister && <input className="w-full px-4 py-2 border rounded-lg" placeholder="姓名" value={fullName} onChange={e=>setFullName(e.target.value)} />}
          <input className="w-full px-4 py-2 border rounded-lg" type="password" placeholder="密码" value={password} onChange={e=>setPassword(e.target.value)} />
          {error && <div className="text-red-500 text-sm">{error}</div>}
          <button className="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">
            {isRegister ? '注册' : '登录'}
          </button>
        </form>
        <div className="mt-4 text-center text-sm text-gray-500">
          {isRegister ? '已有账号？' : '没有账号？'}
          <button className="text-indigo-600 ml-1" onClick={()=>setIsRegister(!isRegister)}>
            {isRegister ? '登录' : '注册'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Chat Message ──
function renderMarkdown(text) {
  if (!text) return '';
  // Trim leading/trailing whitespace to prevent blank space at message edges
  // 1. Escape HTML to prevent XSS
  let html = text.trim()
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  
  // 2. Code blocks (```...```)
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    return '<pre class="bg-gray-800 text-green-300 rounded-lg p-3 my-2 overflow-x-auto text-xs"><code>' + code.trim() + '</code></pre>';
  });
  
  // 3. Inline code (`...`)
  html = html.replace(/`([^`]+)`/g, '<code class="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded text-xs">$1</code>');
  
  // 4. Bold (**...** or __...__)
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold">$1</strong>');
  html = html.replace(/__([^_]+)__/g, '<strong class="font-semibold">$1</strong>');
  
  // 5. Italic (*...* or _..._)
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  html = html.replace(/_([^_]+)_/g, '<em>$1</em>');
  
  // 6. Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" class="text-indigo-600 underline" target="_blank">$1</a>');
  
  // 7. Headings (###, ##, #)
  html = html.replace(/^### (.+)$/gm, '<h3 class="text-base font-semibold mt-3 mb-1">$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2 class="text-lg font-semibold mt-3 mb-1">$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1 class="text-xl font-bold mt-3 mb-1">$1</h1>');
  
  // 8. Unordered lists
  html = html.replace(/^(\s*)[-*] (.+)$/gm, '<li class="ml-4">$2</li>');
  
  // 9. Line breaks: collapse 3+ newlines to 2, then convert to <br>
  html = html.replace(/\n{3,}/g, '\n\n');
  html = html.replace(/\n/g, '<br>');
  
  return html;
}

// Extract skill annotations: <!-- skill:name --> 
function extractSkills(text) {
  if (!text) return { cleaned: text, skills: [] };
  const skills = [];
  const cleaned = text.replace(/<!--\s*skill:(\w+)\s*-->/g, (_, name) => {
    skills.push(name);
    return '';
  });
  return { cleaned, skills };
}

function MessageBubble({ msg }) {
  const isUser = msg.role === 'user';
  const { cleaned, skills } = extractSkills(msg.content || '');
  const msgSkillCalls = skills.length > 0 ? skills : (msg.metadata?.skill_calls || []);
  const msgToolCalls = msg.metadata?.tool_calls || [];
  return (
    <div className={`flex ${isUser ? 'justify-end' : 'justify-start'} mb-4`}>
      {!isUser && <div className="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-sm mr-2 flex-shrink-0">🐂</div>}
      <div className={`max-w-[70%] rounded-2xl px-4 py-2 ${isUser ? 'msg-user rounded-br-md' : 'msg-ai rounded-bl-md'} break-words`}>
        {isUser ? (
          <div className="text-sm whitespace-pre-wrap break-words">{cleaned}</div>
        ) : (
          <div className="text-sm markdown-body" dangerouslySetInnerHTML={{__html: renderMarkdown(cleaned)}} />
        )}
        {/* Skills & Tools */}
        {(msgSkillCalls.length > 0 || msgToolCalls.length > 0) && (
          <div className="flex flex-wrap gap-1 mt-2">
            {msgSkillCalls.map(s => (
              <span key={s} className="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-medium">⚡ {s}</span>
            ))}
            {msgToolCalls.map(t => (
              <span key={t} className="text-xs bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full font-medium">🔧 {t}</span>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Main Chat ──
function ChatView({ session, messages, onSend, streamingContent, model, providers, activeProviderId, toolsEnabled, onProviderChange, onToolsToggle, streamingToolCalls, isThinking }) {
  const [input, setInput] = useState('');
  const bottomRef = useRef(null);
  const inputRef = useRef(null);
  const dotsRef = useRef(null);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, streamingContent, isThinking]);

  // Animated thinking dots
  useEffect(() => {
    if (!isThinking || !dotsRef.current) return;
    let i = 0;
    const states = ['·', '··', '···', '··'];
    const timer = setInterval(() => {
      dotsRef.current.textContent = states[i];
      i = (i + 1) % states.length;
    }, 300);
    return () => clearInterval(timer);
  }, [isThinking]);

  const handleSend = () => {
    if (!input.trim()) return;
    onSend(input, model);
    setInput('');
  };

  const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } };

  const activeProvider = providers?.find(p => p.id === activeProviderId);
  const isAgent = activeProvider?.provider_type === 'claude_agent';

  return (
    <div className="flex-1 flex flex-col" style={{height: '100vh', overflow: 'hidden'}}>
      {/* Header */}
      <div className="h-14 border-b flex items-center px-6 justify-between bg-white flex-shrink-0 gap-3">
        <div className="font-medium truncate">{session?.title || '新对话'}</div>
        <div className="flex items-center gap-3 text-xs">
          {/* Provider selector */}
          {providers?.length > 0 && (
            <select
              className="border rounded px-2 py-1 text-xs bg-white"
              value={activeProviderId || ''}
              onChange={e => onProviderChange(e.target.value)}
              title="选择 LLM Provider"
            >
              <option value="">默认 Provider</option>
              {providers.map(p => (
                <option key={p.id} value={p.id}>{p.name} ({p.provider_type})</option>
              ))}
            </select>
          )}
          {/* Tools toggle (only for agent-type providers) */}
          {isAgent && (
            <label className="flex items-center gap-1 cursor-pointer" title={toolsEnabled ? '工具已启用' : '工具已禁用'}>
              <span className="text-gray-400">🔧</span>
              <input
                type="checkbox"
                checked={toolsEnabled !== false}
                onChange={e => onToolsToggle(e.target.checked)}
                className="w-3.5 h-3.5"
              />
              <span className={toolsEnabled !== false ? 'text-green-600' : 'text-gray-300'}>
                {toolsEnabled !== false ? '工具' : '关闭'}
              </span>
            </label>
          )}
          <span className="text-gray-400">{model || ''}</span>
        </div>
      </div>

      {/* Messages */}
      <div className="flex-1 overflow-y-auto p-6 chat-scroll" style={{overflowY: 'auto'}}>
        {messages.length === 0 && !streamingContent && !isThinking && (
          <div className="text-center text-gray-400 mt-20">
            <div className="text-4xl mb-4">🐂</div>
            <div className="text-lg font-medium">开始新对话</div>
            <div className="text-sm mt-1">输入消息开始聊天，支持 Skills 调用</div>
          </div>
        )}
        {messages.map(msg => <MessageBubble key={msg.id} msg={msg} />)}
        {/* Streaming content with skill+tool badges */}
        {streamingContent && (() => {
          const { cleaned: sc, skills: ss } = extractSkills(streamingContent);
          const allToolCalls = streamingToolCalls || [];
          return (
          <div className="flex items-start mb-4">
            <div className="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-sm mr-2 flex-shrink-0">🐂</div>
            <div className="max-w-[70%]">
              <div className="rounded-2xl rounded-bl-md px-4 py-2 msg-ai break-words">
                <div className="text-sm markdown-body" dangerouslySetInnerHTML={{__html: renderMarkdown(sc)}} />
                {(ss.length > 0 || allToolCalls.length > 0) && (
                  <div className="flex flex-wrap gap-1 mt-2">
                    {ss.map(s => (
                      <span key={s} className="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-medium">⚡ {s}</span>
                    ))}
                    {allToolCalls.map(t => (
                      <span key={t} className="text-xs bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full font-medium">🔧 {t}</span>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        )})()}
        {/* Thinking indicator */}
        {isThinking && !streamingContent && (
          <div className="flex items-start mb-4">
            <div className="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-sm mr-2 flex-shrink-0">🐂</div>
            <div className="rounded-2xl rounded-bl-md px-4 py-3 msg-ai">
              <span ref={dotsRef} className="text-indigo-400 text-lg font-bold">···</span>
            </div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      {/* Input */}
      <div className="p-4 bg-white border-t flex-shrink-0">
        <div className="flex gap-2 max-w-4xl mx-auto">
          <textarea
            ref={inputRef}
            className="flex-1 border rounded-xl px-4 py-3 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-200"
            rows="1" placeholder="输入消息... (Shift+Enter 换行)"
            value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKeyDown}
          />
          <button onClick={handleSend} disabled={!input.trim()}
            className="bg-indigo-600 text-white px-6 rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition">
            发送
          </button>
        </div>
        <div className="text-xs text-gray-400 text-center mt-2">
          AI 助手可能会产生不准确的信息，请核实重要信息。
        </div>
      </div>
    </div>
  );
}

// ── LLM Settings ──
function LLMSettings({ onProvidersChange }) {
  const [providers, setProviders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({
    name: '', provider_type: 'anthropic', base_url: 'http://172.21.3.106', api_key: '',
    is_default: true,
    models: { default: 'qwen3.5-397b-a17b', opus: 'qwen3.5-397b-a17b', sonnet: 'qwen3.5-397b-a17b', haiku: 'qwen3.5-397b-a17b', vision: 'qwen3.5-397b-a17b' },
    config: { timeout: 120, max_tokens: 4096 }
  });
  const [testResult, setTestResult] = useState(null);

  useEffect(() => { loadProviders(); }, []);

  const loadProviders = async () => {
    setLoading(true);
    try { const d = await api('/llm/providers'); setProviders(d); } catch {}
    setLoading(false);
  };

  const handleSubmit = async () => {
    try {
      if (editing) {
        await api(`/llm/providers/${editing}`, { method: 'PATCH', body: JSON.stringify(form) });
      } else {
        await api('/llm/providers', { method: 'POST', body: JSON.stringify(form) });
      }
      setShowForm(false); setEditing(null);
      loadProviders();
      if (onProvidersChange) onProvidersChange();
    } catch (err) { alert('保存失败: ' + err); }
  };

  const handleDelete = async (id) => {
    if (!confirm('确认删除？')) return;
    await api(`/llm/providers/${id}`, { method: 'DELETE' });
    loadProviders();
    if (onProvidersChange) onProvidersChange();
  };

  const handleTest = async () => {
    setTestResult(null);
    const res = await api(`/llm/test`, { method: 'POST', body: JSON.stringify({
      name: 'Test Provider',
      base_url: form.base_url,
      provider_type: form.provider_type,
      api_key: form.api_key,
      models: form.models,
    })});
    setTestResult(res);
  };

  const updateModel = (key, val) => setForm(f => ({...f, models: {...f.models, [key]: val}}));

  return (
    <div className="flex-1 overflow-y-auto p-8">
      <div className="max-w-4xl mx-auto">
        <div className="flex items-center justify-between mb-6">
          <h1 className="text-2xl font-bold">🤖 LLM Provider 设置</h1>
          <button onClick={() => { setEditing(null); setShowForm(true); }}
            className="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
            + 添加 Provider
          </button>
        </div>

        {showForm && (
          <div className="bg-white rounded-xl p-6 shadow-sm border mb-6">
            <h3 className="font-medium mb-4">{editing ? '编辑 Provider' : '新建 Provider'}</h3>
            <div className="space-y-4">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-sm text-gray-500">名称</label>
                  <input className="w-full border rounded px-3 py-2 mt-1" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="如: Minimax" />
                </div>
                <div>
                  <label className="text-sm text-gray-500">类型</label>
                  <select className="w-full border rounded px-3 py-2 mt-1" value={form.provider_type} onChange={e=>setForm(f=>({...f,provider_type:e.target.value}))}>
                    <option value="anthropic">Anthropic (Claude 兼容)</option>
                    <option value="openai">OpenAI 兼容</option>
                    <option value="claude_agent">Claude Agent SDK (支持工具/Subagent)</option>
                  </select>
                </div>
              </div>
              <div>
                <label className="text-sm text-gray-500">BASE URL</label>
                <input className="w-full border rounded px-3 py-2 mt-1" value={form.base_url} onChange={e=>setForm(f=>({...f,base_url:e.target.value}))} placeholder="http://172.21.3.106" />
              </div>
              <div>
                <label className="text-sm text-gray-500">AUTH TOKEN (可选)</label>
                <input className="w-full border rounded px-3 py-2 mt-1" type="password" value={form.api_key} onChange={e=>setForm(f=>({...f,api_key:e.target.value}))} placeholder="留空则使用无认证" />
              </div>
              <div className="grid grid-cols-5 gap-3">
                {['default','opus','sonnet','haiku','vision'].map(type => (
                  <div key={type}>
                    <label className="text-xs text-gray-500 uppercase">{type}</label>
                    <input className="w-full border rounded px-2 py-1 mt-1 text-sm" value={form.models[type]||''} onChange={e=>updateModel(type,e.target.value)} />
                  </div>
                ))}
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-sm text-gray-500">超时 (秒)</label>
                  <input className="w-full border rounded px-3 py-2 mt-1" type="number" value={form.config.timeout||120}
                    onChange={e=>setForm(f=>({...f,config:{...f.config,timeout:parseInt(e.target.value)}}))} />
                </div>
                <div>
                  <label className="text-sm text-gray-500">最大 Token</label>
                  <input className="w-full border rounded px-3 py-2 mt-1" type="number" value={form.config.max_tokens||4096}
                    onChange={e=>setForm(f=>({...f,config:{...f.config,max_tokens:parseInt(e.target.value)}}))} />
                </div>
              </div>
              <div className="flex gap-3">
                <button onClick={handleTest} className="px-4 py-2 border rounded hover:bg-gray-50 text-sm">🧪 测试连接</button>
                <button onClick={handleSubmit} className="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 text-sm">保存</button>
                <button onClick={()=>{setShowForm(false);setEditing(null);}} className="px-4 py-2 border rounded hover:bg-gray-50 text-sm">取消</button>
              </div>
              {testResult && (
                <div className={`text-sm px-3 py-2 rounded ${testResult.status==='success'?'bg-green-50 text-green-700':'bg-red-50 text-red-700'}`}>
                  {testResult.status === 'success' ? '✅ ' + testResult.message : '❌ ' + testResult.message}
                </div>
              )}
            </div>
          </div>
        )}

        {loading ? <div className="text-center text-gray-400 py-10">加载中...</div> : providers.length === 0 ? (
          <div className="text-center text-gray-400 py-10">暂无 Provider，点击上方添加</div>
        ) : (
          <div className="space-y-4">
            {providers.map(p => (
              <div key={p.id} className="bg-white rounded-xl p-5 shadow-sm border">
                <div className="flex items-start justify-between">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-medium">{p.name}</span>
                      <span className={`text-xs px-2 py-0.5 rounded ${p.provider_type==='anthropic'?'bg-purple-100 text-purple-700':'bg-blue-100 text-blue-700'}`}>{p.provider_type}</span>
                      {p.is_default && <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">默认</span>}
                    </div>
                    <div className="text-sm text-gray-400 mt-1">{p.base_url}</div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={()=>{setEditing(p.id);setForm({name:p.name,provider_type:p.provider_type,base_url:p.base_url,api_key:p.api_key||'',is_default:p.is_default,models:{...p.models},config:{...p.config}});setShowForm(true);}}
                      className="text-sm text-indigo-600 hover:underline">编辑</button>
                    <button onClick={()=>handleDelete(p.id)} className="text-sm text-red-500 hover:underline">删除</button>
                  </div>
                </div>
                <div className="mt-3 flex flex-wrap gap-2">
                  {Object.entries(p.models||{}).map(([k,v])=>(
                    <span key={k} className="text-xs bg-gray-100 px-2 py-1 rounded">{k}: <b>{v}</b></span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}
function App() {
  const [token, setToken] = useState(localStorage.getItem('token'));
  const [user, setUser] = useState(null);
  const [sessions, setSessions] = useState([]);
  const [currentSession, setCurrentSession] = useState(null);
  const [messages, setMessages] = useState([]);
  const [streamingContent, setStreamingContent] = useState('');
  const [view, setView] = useState('chat'); // 'chat' | 'dashboard' | 'settings'
  const [previousView, setPreviousView] = useState('chat');
  const [llmProvider, setLlmProvider] = useState({ models: {} });
  const [providers, setProviders] = useState([]);
  const [model, setModel] = useState('');
  const [sessionProviderId, setSessionProviderId] = useState(null);
  const [sessionToolsEnabled, setSessionToolsEnabled] = useState(true);
  const [streamingToolCalls, setStreamingToolCalls] = useState([]);
  const [isThinking, setIsThinking] = useState(false);
  const loadUserLock = useRef(false);

  useEffect(() => {
    if (token && !loadUserLock.current) loadUser();
  }, [token]);

  useEffect(() => {
    if (user) { loadSessions(); loadProviders(); }
  }, [user]);

  const loadUser = async () => {
    if (loadUserLock.current) return;
    loadUserLock.current = true;
    try {
      const u = await api('/auth/me');
      setUser(u);
    } catch (e) {
      if (e.message === 'SESSION_EXPIRED') {
        setToken(null);
      } else {
        localStorage.removeItem('token');
        setToken(null);
      }
    } finally {
      loadUserLock.current = false;
    }
  };

  const loadSessions = async () => {
    try {
      const data = await api('/chat/sessions');
      setSessions(data);
    } catch {}
  };

  const loadProviders = async () => {
    try {
      const data = await api('/llm/providers');
      if (data.length > 0) {
        setLlmProvider(data[0]);
        setProviders(data);
      }
    } catch {}
  };

  const handleNewChat = async () => {
    try {
      const body = {
        title: '新对话',
        model: model || undefined,
        provider_id: sessionProviderId || llmProvider?.id || undefined,
      };
      const s = await api('/chat/sessions', { method: 'POST', body: JSON.stringify(body) });
      setSessions(prev => [s, ...prev]);
      setCurrentSession(s);
      setMessages([]);
      setSessionProviderId(s.provider_id || null);
      setSessionToolsEnabled(s.tools_enabled !== false);
      setView('chat');
    } catch {}
  };

  const handleSelectSession = async (sessionId) => {
    try {
      const s = await api(`/chat/sessions/${sessionId}`);
      const msgs = await api(`/chat/sessions/${sessionId}/messages`);
      setCurrentSession(s);
      setMessages(msgs);
      setSessionProviderId(s.provider_id || null);
      setSessionToolsEnabled(s.tools_enabled !== false);
      if (s.model) setModel(s.model);
      setView('chat');
    } catch {}
  };

  const handleUpdateSession = async (updates) => {
    if (!currentSession?.id) return;
    try {
      const s = await api(`/chat/sessions/${currentSession.id}`, {
        method: 'PATCH',
        body: JSON.stringify(updates),
      });
      setCurrentSession(s);
      // Update session in list
      setSessions(prev => prev.map(x => x.id === s.id ? s : x));
    } catch (e) {
      console.error('Failed to update session', e);
    }
  };

  const handleProviderChange = async (providerId) => {
    setSessionProviderId(providerId || null);
    const p = providers.find(x => x.id === providerId);
    if (p) {
      const defaultModel = Object.values(p.models || {})[0] || '';
      setModel(defaultModel);
    }
    await handleUpdateSession({ provider_id: providerId || null });
  };

  const handleToolsToggle = async (enabled) => {
    setSessionToolsEnabled(enabled);
    await handleUpdateSession({ tools_enabled: enabled });
  };

  const handleSend = async (content, model) => {
    // Ensure session exists
    let sessionId = currentSession?.id;
    if (!sessionId) {
      try {
        const s = await api('/chat/sessions', { method: 'POST', body: JSON.stringify({ title: content.slice(0, 20) || '新对话', model: model || undefined, provider_id: sessionProviderId || llmProvider?.id || undefined }) });
        setSessions(prev => [s, ...prev]);
        setCurrentSession(s);
        sessionId = s.id;
      } catch (e) {
        if (e.message === 'SESSION_EXPIRED') { setToken(null); }
        return;
      }
    }

    // Add user message immediately
    const tempUserMsg = { id: 'temp-' + Date.now(), role: 'user', content, created_at: new Date().toISOString() };
    setMessages(prev => [...prev, tempUserMsg]);
    setStreamingContent('');
    setStreamingToolCalls([]);
    setIsThinking(true);

    try {
      const response = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({
          session_id: sessionId,
          message: content,
          model: model || undefined,
          provider_id: sessionProviderId || undefined,
          tools_enabled: sessionToolsEnabled,
        }),
      });

      if (!response.ok) {
        if (response.status === 401) { setToken(null); return; }
        throw new Error(`HTTP ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));
            if (data.type === 'text') {
              setIsThinking(false);
              setStreamingContent(prev => prev + data.content);
            } else if (data.type === 'done') {
              setStreamingToolCalls(data.tool_calls || []);
            } else if (data.type === 'error') {
              setStreamingContent(prev => prev + '\n⚠️ 错误: ' + data.message);
            }
          } catch (parseErr) {}
        }
      }

      // Reload messages from server to get properly saved versions
      const msgs = await api(`/chat/sessions/${sessionId}/messages`);
      setMessages(msgs);
      setStreamingContent('');
      setStreamingToolCalls([]);
      setIsThinking(false);
    } catch (err) {
      if (err.message === 'SESSION_EXPIRED') { setToken(null); return; }
      console.error(err);
      setStreamingContent(prev => prev + '\n⚠️ 连接中断: ' + err.message);
      setIsThinking(false);
    }
  };

  const handleLogin = (t) => { setToken(t); };

  if (!token) return <LoginPage onLogin={handleLogin} />;

  return (
    <div className="flex" style={{height: '100vh'}}>
      <Sidebar sessions={sessions} currentSession={currentSession} onSelectSession={handleSelectSession} onNewChat={handleNewChat} user={user} onOpenSettings={() => { setPreviousView(view); setView('settings'); }} />
      <div className="flex-1 flex flex-col bg-gray-50">
        {view === 'settings' ? (
          <div className="flex-1 overflow-y-auto">
            <nav className="h-12 border-b flex items-center px-6 bg-white">
              <button onClick={() => setView(previousView)} className="text-sm font-medium text-indigo-600 flex items-center gap-1">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                返回
              </button>
              <span className="text-sm font-medium ml-4">⚙️ 设置</span>
            </nav>
            {/* Current Model Selection */}
            <div className="max-w-4xl mx-auto p-8 pb-0">
              <div className="bg-white rounded-xl p-6 shadow-sm border mb-6">
                <h2 className="font-medium mb-4 text-lg">🔌 当前模型</h2>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="text-sm text-gray-500">Provider</label>
                    <select className="w-full border rounded px-3 py-2 mt-1" value={llmProvider?.id || ''} onChange={e => { const p = providers.find(x => x.id === e.target.value); if (p) { setLlmProvider(p); setModel(Object.values(p.models)[0] || ''); } }}>
                      {providers.map(p => <option key={p.id} value={p.id}>{p.name} ({p.provider_type})</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-sm text-gray-500">模型</label>
                    <select className="w-full border rounded px-3 py-2 mt-1" value={model} onChange={e => setModel(e.target.value)}>
                      <option value="">-- 选择模型 --</option>
                      {llmProvider.models && Object.entries(llmProvider.models).map(([type, m]) => (
                        <option key={type} value={m}>{type}: {m}</option>
                      ))}
                    </select>
                  </div>
                </div>
                {model && <div className="mt-2 text-xs text-green-600">✅ 当前使用: {model}</div>}
              </div>
            </div>
            <LLMSettings onProvidersChange={loadProviders} />
          </div>
        ) : (
          <>
            <nav className="h-12 border-b flex items-center px-6 gap-6 bg-white">
              <button onClick={()=>setView('chat')} className={`text-sm font-medium ${view==='chat'?'text-indigo-600':'text-gray-500'}`}>对话</button>
              <button onClick={()=>setView('dashboard')} className={`text-sm font-medium ${view==='dashboard'?'text-indigo-600':'text-gray-500'}`}>概览</button>
            </nav>
            {view === 'dashboard' ? (
              <Dashboard user={user} sessions={sessions} />
            ) : (
              <ChatView
                session={currentSession}
                messages={messages}
                onSend={handleSend}
                streamingContent={streamingContent}
                model={model}
                providers={providers}
                activeProviderId={sessionProviderId || llmProvider?.id || null}
                toolsEnabled={sessionToolsEnabled}
                onProviderChange={handleProviderChange}
                onToolsToggle={handleToolsToggle}
                streamingToolCalls={streamingToolCalls}
                isThinking={isThinking}
              />
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
