<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Web Tool - 企业内部AI助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; }
    .h-screen { height: 100vh; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .min-h-screen { min-height: 100vh; }
    .flex-1 { flex: 1; }
    .overflow-hidden { overflow: hidden; }
    .overflow-y-auto { overflow-y: auto; }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    .msg-ai { background: #f1f5f9; word-break: break-word; overflow-wrap: break-word; }
    .msg-user { background: #3b82f6; color: white; word-break: break-word; overflow-wrap: break-word; }
    .heatmap-day { transition: opacity 0.2s; }
    .heatmap-day:hover { opacity: 0.8; }
    @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .pulse-dot { animation: pulse-dot 1.5s infinite; }
  </style>
</head>
<body class="bg-gray-50">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── API Helper ──
const API_BASE = '/api';

async function api(path, opts = {}) {
  const token = localStorage.getItem('token');
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...opts.headers,
    },
  });
  if (res.status === 401) { window.location.href = '/login'; return; }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── Login ──
function LoginPage({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [isRegister, setIsRegister] = useState(false);
  const [fullName, setFullName] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    try {
      if (isRegister) {
        await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({ username, password, email: username + '@company.com', full_name: fullName }),
        });
      }
      const data = await api('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      });
      localStorage.setItem('token', data.access_token);
      onLogin(data.access_token);
    } catch (err) {
      setError(err.message || 'Login failed');
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
      <div className="bg-white rounded-2xl shadow-xl p-8 w-96">
        <h1 className="text-2xl font-bold text-center mb-6 text-indigo-600">🐂 AI Web Tool</h1>
        <form onSubmit={handleSubmit} className="space-y-4">
          <input className="w-full px-4 py-2 border rounded-lg" placeholder="用户名" value={username} onChange={e=>setUsername(e.target.value)} />
          {isRegister && <input className="w-full px-4 py-2 border rounded-lg" placeholder="姓名" value={fullName} onChange={e=>setFullName(e.target.value)} />}
          <input className="w-full px-4 py-2 border rounded-lg" type="password" placeholder="密码" value={password} onChange={e=>setPassword(e.target.value)} />
          {error && <div className="text-red-500 text-sm">{error}</div>}
          <button className="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">
            {isRegister ? '注册' : '登录'}
          </button>
        </form>
        <div className="mt-4 text-center text-sm text-gray-500">
          {isRegister ? '已有账号？' : '没有账号？'}
          <button className="text-indigo-600 ml-1" onClick={()=>setIsRegister(!isRegister)}>
            {isRegister ? '登录' : '注册'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Sidebar ──
function Sidebar({ sessions, currentSession, onSelectSession, onNewChat, user }) {
  return (
    <div className="w-64 bg-white border-r flex flex-col" style={{height: '100vh'}}>
      <div className="p-4 border-b">
        <button onClick={onNewChat} className="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition flex items-center justify-center gap-2">
          <span className="text-lg">+</span> 新对话
        </button>
      </div>
      <div className="flex-1 overflow-y-auto p-2">
        <div className="text-xs font-semibold text-gray-400 uppercase mt-4 mb-2 px-2">历史对话</div>
        {sessions.map(s => (
          <div key={s.id} onClick={()=>onSelectSession(s.id)}
            className={`p-2 rounded-lg cursor-pointer mb-1 text-sm truncate ${currentSession?.id === s.id ? 'bg-indigo-50 text-indigo-700' : 'hover:bg-gray-100'}`}>
            {s.title || '新对话'}
          </div>
        ))}
      </div>
      <div className="p-4 border-t flex items-center gap-3">
        <div className="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold">
          {user?.full_name?.[0] || user?.username?.[0] || 'U'}
        </div>
        <div className="text-sm">
          <div className="font-medium">{user?.full_name || user?.username}</div>
          <div className="text-xs text-gray-400">内部版</div>
        </div>
      </div>
    </div>
  );
}

// ── Chat Message ──
function MessageBubble({ msg }) {
  const isUser = msg.role === 'user';
  return (
    <div className={`flex ${isUser ? 'justify-end' : 'justify-start'} mb-4`}>
      {!isUser && <div className="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-sm mr-2 flex-shrink-0">🐂</div>}
      <div className={`max-w-[70%] rounded-2xl px-4 py-2 ${isUser ? 'msg-user rounded-br-md' : 'msg-ai rounded-bl-md'} break-words`}>
        <div className="text-sm whitespace-pre-wrap break-words">{msg.content}</div>
        {msg.metadata?.skill_calls?.length > 0 && (
          <div className="text-xs mt-1 opacity-60">via {msg.metadata.skill_calls.join(', ')}</div>
        )}
      </div>
    </div>
  );
}

// ── Main Chat ──
function ChatView({ session, messages, onSend, streamingContent, llmProvider, providers, model, setModel, onProviderChange }) {
  const [input, setInput] = useState('');
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, streamingContent]);

  const handleSend = () => {
    if (!input.trim()) return;
    onSend(input, model);
    setInput('');
  };

  const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } };

  return (
    <div className="flex-1 flex flex-col" style={{height: '100vh', overflow: 'hidden'}}>
      {/* Header */}
      <div className="h-14 border-b flex items-center px-6 justify-between bg-white flex-shrink-0">
        <div className="font-medium">{session?.title || '新对话'}</div>
        <div className="flex items-center gap-2">
          <span className="text-sm text-gray-500">Provider:</span>
          <select className="text-sm border rounded px-2 py-1" value={llmProvider?.id || ''} onChange={e => { const p = providers.find(x => x.id === e.target.value); if (p) onProviderChange(p); }}>
            {providers.map(p => <option key={p.id} value={p.id}>{p.name} ({p.provider_type})</option>)}
          </select>
          <span className="text-sm text-gray-500">模型:</span>
          <select className="text-sm border rounded px-2 py-1" value={model} onChange={e=>setModel(e.target.value)}>
            <option value="">-- 选择模型 --</option>
            {llmProvider.models && Object.entries(llmProvider.models).map(([type, m]) => (
              <option key={type} value={m}>{type}: {m}</option>
            ))}
          </select>
        </div>
      </div>

      {/* Messages */}
      <div className="flex-1 overflow-y-auto p-6 chat-scroll" style={{overflowY: 'auto'}}>
        {messages.length === 0 && (
          <div className="text-center text-gray-400 mt-20">
            <div className="text-4xl mb-4">🐂</div>
            <div className="text-lg font-medium">开始新对话</div>
            <div className="text-sm mt-1">输入消息开始聊天，支持 Skills 调用</div>
          </div>
        )}
        {messages.map(msg => <MessageBubble key={msg.id} msg={msg} />)}
        {streamingContent && <MessageBubble msg={{ role: 'assistant', content: streamingContent }} />}
        <div ref={bottomRef} />
      </div>

      {/* Input */}
      <div className="p-4 bg-white border-t flex-shrink-0">
        <div className="flex gap-2 max-w-4xl mx-auto">
          <textarea
            ref={inputRef}
            className="flex-1 border rounded-xl px-4 py-3 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-200"
            rows="1" placeholder="输入消息... (Shift+Enter 换行)"
            value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKeyDown}
          />
          <button onClick={handleSend} disabled={!input.trim()}
            className="bg-indigo-600 text-white px-6 rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition">
            发送
          </button>
        </div>
        <div className="text-xs text-gray-400 text-center mt-2">
          AI 助手可能会产生不准确的信息，请核实重要信息。
        </div>
      </div>
    </div>
  );
}

// ── Overview Dashboard ──
function Dashboard({ user, sessions }) {
  const totalMessages = sessions.reduce((sum, s) => sum + (s.message_count || 0), 0);
  
  // Fake heatmap data
  const heatmapData = Array.from({length: 90}, () => Math.random() * 10);

  return (
    <div className="flex-1 overflow-y-auto p-8">
      <div className="max-w-4xl mx-auto">
        <h1 className="text-2xl font-bold mb-1">👋 欢迎回来, {user?.full_name || user?.username}</h1>
        <p className="text-gray-500 mb-8">这里是您的 AI 助手工作台</p>

        <div className="grid grid-cols-3 gap-4 mb-8">
          <div className="bg-white rounded-xl p-6 shadow-sm border">
            <div className="text-3xl font-bold text-indigo-600">{sessions.length}</div>
            <div className="text-gray-500 text-sm mt-1">会话总数</div>
          </div>
          <div className="bg-white rounded-xl p-6 shadow-sm border">
            <div className="text-3xl font-bold text-indigo-600">{totalMessages}</div>
            <div className="text-gray-500 text-sm mt-1">消息总数</div>
          </div>
          <div className="bg-white rounded-xl p-6 shadow-sm border">
            <div className="text-3xl font-bold text-indigo-600">{sessions.filter(s => {
              const d = new Date(s.updated_at || s.created_at);
              const diff = Date.now() - d.getTime();
              return diff < 2 * 24 * 60 * 60 * 1000;
            }).length}</div>
            <div className="text-gray-500 text-sm mt-1">近2天活跃</div>
          </div>
        </div>

        <div className="bg-white rounded-xl p-6 shadow-sm border mb-8">
          <div className="font-medium mb-4">📊 活动热力图（近90天）</div>
          <div className="flex gap-1 flex-wrap">
            {heatmapData.map((val, i) => (
              <div key={i} className="w-3 h-3 rounded-sm heatmap-day" 
                style={{backgroundColor: `rgba(59, 130, 246, ${val / 10})`}} 
                title={`Day ${i}: ${Math.round(val)} messages`} />
            ))}
          </div>
          <div className="flex justify-between mt-2 text-xs text-gray-400">
            <span>90天前</span>
            <div className="flex gap-1"><span>少</span>{[0.1,0.3,0.5,0.7,0.9].map((o,i)=>(
              <span key={i} className="w-3 h-3 rounded-sm" style={{backgroundColor:`rgba(59,130,246,${o})`}}/>))}<span>多</span></div>
            <span>今天</span>
          </div>
        </div>

        <div className="bg-white rounded-xl p-6 shadow-sm border">
          <div className="font-medium mb-4">⚡ 快捷技能</div>
          <div className="grid grid-cols-2 gap-3">
            {[
              { name: '🌤️ 查天气', desc: '查询任意城市天气' },
              { name: '🔢 计算器', desc: '数学计算' },
              { name: '⏰ 提醒', desc: '设置定时提醒' },
              { name: '❓ 常见问答', desc: '公司常见问题' },
            ].map(skill => (
              <div key={skill.name} className="p-3 border rounded-lg hover:bg-gray-50 cursor-pointer transition">
                <div className="font-medium text-sm">{skill.name}</div>
                <div className="text-xs text-gray-400 mt-1">{skill.desc}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── LLM Settings ──
function LLMSettings() {
  const [providers, setProviders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({
    name: '', provider_type: 'anthropic', base_url: 'http://172.21.3.106', api_key: '',
    is_default: true,
    models: { default: 'qwen3.5-397b-a17b', opus: 'qwen3.5-397b-a17b', sonnet: 'qwen3.5-397b-a17b', haiku: 'qwen3.5-397b-a17b', vision: 'qwen3.5-397b-a17b' },
    config: { timeout: 120, max_tokens: 4096 }
  });
  const [testResult, setTestResult] = useState(null);

  useEffect(() => { loadProviders(); }, []);

  const loadProviders = async () => {
    setLoading(true);
    try { const d = await api('/llm/providers'); setProviders(d); } catch {}
    setLoading(false);
  };

  const handleSubmit = async () => {
    try {
      if (editing) {
        await api(`/llm/providers/${editing}`, { method: 'PATCH', body: JSON.stringify(form) });
      } else {
        await api('/llm/providers', { method: 'POST', body: JSON.stringify(form) });
      }
      setShowForm(false); setEditing(null);
      loadProviders();
    } catch (err) { alert('保存失败: ' + err); }
  };

  const handleDelete = async (id) => {
    if (!confirm('确认删除？')) return;
    await api(`/llm/providers/${id}`, { method: 'DELETE' });
    loadProviders();
  };

  const handleTest = async () => {
    setTestResult(null);
    const res = await api(`/llm/test`, { method: 'POST', body: JSON.stringify({
      name: 'Test Provider',
      base_url: form.base_url,
      provider_type: form.provider_type,
      api_key: form.api_key,
      models: form.models,
    })});
    setTestResult(res);
  };

  const updateModel = (key, val) => setForm(f => ({...f, models: {...f.models, [key]: val}}));

  return (
    <div className="flex-1 overflow-y-auto p-8">
      <div className="max-w-4xl mx-auto">
        <div className="flex items-center justify-between mb-6">
          <h1 className="text-2xl font-bold">🤖 LLM Provider 设置</h1>
          <button onClick={() => { setEditing(null); setShowForm(true); }}
            className="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
            + 添加 Provider
          </button>
        </div>

        {showForm && (
          <div className="bg-white rounded-xl p-6 shadow-sm border mb-6">
            <h3 className="font-medium mb-4">{editing ? '编辑 Provider' : '新建 Provider'}</h3>
            <div className="space-y-4">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-sm text-gray-500">名称</label>
                  <input className="w-full border rounded px-3 py-2 mt-1" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="如: Minimax" />
                </div>
                <div>
                  <label className="text-sm text-gray-500">类型</label>
                  <select className="w-full border rounded px-3 py-2 mt-1" value={form.provider_type} onChange={e=>setForm(f=>({...f,provider_type:e.target.value}))}>
                    <option value="anthropic">Anthropic (Claude 兼容)</option>
                    <option value="openai">OpenAI 兼容</option>
                    <option value="claude_agent">Claude Agent SDK (支持工具/Subagent)</option>
                  </select>
                </div>
              </div>
              <div>
                <label className="text-sm text-gray-500">BASE URL</label>
                <input className="w-full border rounded px-3 py-2 mt-1" value={form.base_url} onChange={e=>setForm(f=>({...f,base_url:e.target.value}))} placeholder="http://172.21.3.106" />
              </div>
              <div>
                <label className="text-sm text-gray-500">AUTH TOKEN (可选)</label>
                <input className="w-full border rounded px-3 py-2 mt-1" type="password" value={form.api_key} onChange={e=>setForm(f=>({...f,api_key:e.target.value}))} placeholder="留空则使用无认证" />
              </div>
              <div className="grid grid-cols-5 gap-3">
                {['default','opus','sonnet','haiku','vision'].map(type => (
                  <div key={type}>
                    <label className="text-xs text-gray-500 uppercase">{type}</label>
                    <input className="w-full border rounded px-2 py-1 mt-1 text-sm" value={form.models[type]||''} onChange={e=>updateModel(type,e.target.value)} />
                  </div>
                ))}
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-sm text-gray-500">超时 (秒)</label>
                  <input className="w-full border rounded px-3 py-2 mt-1" type="number" value={form.config.timeout||120}
                    onChange={e=>setForm(f=>({...f,config:{...f.config,timeout:parseInt(e.target.value)}}))} />
                </div>
                <div>
                  <label className="text-sm text-gray-500">最大 Token</label>
                  <input className="w-full border rounded px-3 py-2 mt-1" type="number" value={form.config.max_tokens||4096}
                    onChange={e=>setForm(f=>({...f,config:{...f.config,max_tokens:parseInt(e.target.value)}}))} />
                </div>
              </div>
              <div className="flex gap-3">
                <button onClick={handleTest} className="px-4 py-2 border rounded hover:bg-gray-50 text-sm">🧪 测试连接</button>
                <button onClick={handleSubmit} className="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 text-sm">保存</button>
                <button onClick={()=>{setShowForm(false);setEditing(null);}} className="px-4 py-2 border rounded hover:bg-gray-50 text-sm">取消</button>
              </div>
              {testResult && (
                <div className={`text-sm px-3 py-2 rounded ${testResult.status==='success'?'bg-green-50 text-green-700':'bg-red-50 text-red-700'}`}>
                  {testResult.status === 'success' ? '✅ ' + testResult.message : '❌ ' + testResult.message}
                </div>
              )}
            </div>
          </div>
        )}

        {loading ? <div className="text-center text-gray-400 py-10">加载中...</div> : providers.length === 0 ? (
          <div className="text-center text-gray-400 py-10">暂无 Provider，点击上方添加</div>
        ) : (
          <div className="space-y-4">
            {providers.map(p => (
              <div key={p.id} className="bg-white rounded-xl p-5 shadow-sm border">
                <div className="flex items-start justify-between">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-medium">{p.name}</span>
                      <span className={`text-xs px-2 py-0.5 rounded ${p.provider_type==='anthropic'?'bg-purple-100 text-purple-700':'bg-blue-100 text-blue-700'}`}>{p.provider_type}</span>
                      {p.is_default && <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">默认</span>}
                    </div>
                    <div className="text-sm text-gray-400 mt-1">{p.base_url}</div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={()=>{setEditing(p.id);setForm({name:p.name,provider_type:p.provider_type,base_url:p.base_url,api_key:p.api_key||'',is_default:p.is_default,models:{...p.models},config:{...p.config}});setShowForm(true);}}
                      className="text-sm text-indigo-600 hover:underline">编辑</button>
                    <button onClick={()=>handleDelete(p.id)} className="text-sm text-red-500 hover:underline">删除</button>
                  </div>
                </div>
                <div className="mt-3 flex flex-wrap gap-2">
                  {Object.entries(p.models||{}).map(([k,v])=>(
                    <span key={k} className="text-xs bg-gray-100 px-2 py-1 rounded">{k}: <b>{v}</b></span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}
function App() {
  const [token, setToken] = useState(localStorage.getItem('token'));
  const [user, setUser] = useState(null);
  const [sessions, setSessions] = useState([]);
  const [currentSession, setCurrentSession] = useState(null);
  const [messages, setMessages] = useState([]);
  const [streamingContent, setStreamingContent] = useState('');
  const [view, setView] = useState('chat'); // 'chat' | 'dashboard' | 'llm'
  const [llmProvider, setLlmProvider] = useState({ models: {} });
  const [providers, setProviders] = useState([]);
  const [model, setModel] = useState('');

  useEffect(() => {
    if (token) loadUser();
  }, [token]);

  useEffect(() => {
    if (user) { loadSessions(); loadProviders(); }
  }, [user]);

  const loadUser = async () => {
    try { const u = await api('/auth/me'); setUser(u); } catch { localStorage.removeItem('token'); setToken(null); }
  };

  const loadSessions = async () => {
    try {
      const data = await api('/chat/sessions');
      setSessions(data);
    } catch {}
  };

  const loadProviders = async () => {
    try {
      const data = await api('/llm/providers');
      if (data.length > 0) {
        setLlmProvider(data[0]);
        setProviders(data);
      }
    } catch {}
  };

  const handleNewChat = async () => {
    try {
      const s = await api('/chat/sessions', { method: 'POST', body: JSON.stringify({ title: '新对话' }) });
      setSessions(prev => [s, ...prev]);
      setCurrentSession(s);
      setMessages([]);
      setView('chat');
    } catch {}
  };

  const handleSelectSession = async (sessionId) => {
    try {
      const s = await api(`/chat/sessions/${sessionId}`);
      const msgs = await api(`/chat/sessions/${sessionId}/messages`);
      setCurrentSession(s);
      setMessages(msgs);
      setView('chat');
    } catch {}
  };

  const handleSend = async (content, model) => {
    if (!currentSession) { await handleNewChat(); }
    
    const sessionId = currentSession?.id || sessions[0]?.id;
    if (!sessionId) return;

    // Add user message immediately
    const tempUserMsg = { id: 'temp-' + Date.now(), role: 'user', content, created_at: new Date().toISOString() };
    setMessages(prev => [...prev, tempUserMsg]);
    setStreamingContent('');

    try {
      // Streaming via fetch+readable stream
      const res = await fetch(API_BASE + '/chat/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ session_id: sessionId, message: content, model, stream: true }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        full += chunk;
        setStreamingContent(full);
      }

      // Reload messages
      const msgs = await api(`/chat/sessions/${sessionId}/messages`);
      setMessages(msgs);
      setStreamingContent('');
    } catch (err) {
      console.error(err);
      setStreamingContent('');
    }
  };

  const handleLogin = (t) => { setToken(t); };

  if (!token) return <LoginPage onLogin={handleLogin} />;

  return (
    <div className="flex" style={{height: '100vh'}}>
      <Sidebar sessions={sessions} currentSession={currentSession} onSelectSession={handleSelectSession} onNewChat={handleNewChat} user={user} />
      <div className="flex-1 flex flex-col bg-gray-50">
        <nav className="h-12 border-b flex items-center px-6 gap-6 bg-white">
          <button onClick={()=>setView('chat')} className={`text-sm font-medium ${view==='chat'?'text-indigo-600':'text-gray-500'}`}>对话</button>
          <button onClick={()=>setView('dashboard')} className={`text-sm font-medium ${view==='dashboard'?'text-indigo-600':'text-gray-500'}`}>概览</button>
          <button onClick={()=>setView('llm')} className={`text-sm font-medium ${view==='llm'?'text-indigo-600':'text-gray-500'}`}>LLM 设置</button>
          <button className="text-sm text-gray-500">Skills</button>
          <button className="text-sm text-gray-500">定时任务</button>
          <button className="text-sm text-gray-500">记忆</button>
        </nav>
        {view === 'dashboard' ? (
          <Dashboard user={user} sessions={sessions} />
        ) : view === 'llm' ? (
          <LLMSettings />
        ) : (
          <ChatView session={currentSession} messages={messages} onSend={handleSend} streamingContent={streamingContent} llmProvider={llmProvider} providers={providers} model={model} setModel={setModel} onProviderChange={p => { setLlmProvider(p); setModel(Object.values(p.models)[0] || ''); }} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
